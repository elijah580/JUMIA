<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/2a06cd8ce3.js" crossorigin="anonymous"></script>
    <title>Jumia</title>
    <link rel="stylesheet" href=css/jumia.css>
</head>

<body>
    <div class="firstbanner"><img src="img/TW-BD_Desktop_top-strip-copy.gif" alt=""></div>
    <div class="smallbox">

        <p class="sell-org"><i class="fa-solid fa-star"></i>Sell on Jumia</p>

        <p class="smallbox-p">
            <span id="special">JUMIA<i class="fa-solid fa-star"></i></span>
            <span id="blue-hover"><i class="fa-solid fa-shield-halved"></i>PAY</span>
            <span id="black-hover"><i class="fa-solid fa-star"></i>DELIVERY</span>
        </p>
    </div>
    <div class="boxset">
        <span id="bigman">JUMIA<i class="fa-solid fa-star"></i> </span>
        <div class="link-box">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search for products,brands and more">
                <button class="searchbtn">Search</button>
            </div>
            <div class="link-inbox">
                <span> <i class="fa-regular fa-user"></i>
                    Account
                    <i class="fa-solid fa-chevron-down"></i>
                </span>
                <span>
                    <i class="fa-regular fa-question-circle"></i>
                    Help
                    <i class="fa-solid fa-chevron-down"></i>
                </span>
                <span> <i class="fa-solid fa-shopping-cart"></i>
                    Cart
                </span>
            </div>
        </div>
    </div>
    <div class="biggbox">
        <div class="inbox"></div>
        <div class="centrebox">
            <span><i class="fa-solid fa-bag-shopping"></i>Official Store</span>
            <span>Appliances</span>
            <span>Phone & Tablets</span>
            <span>Health & Beauty</span>
            <span>Home & Office</span>
            <span>Electronics</span>
            <span>Fashion</span>
            <span>Supermarket</span>
            <span>Computing</span>
            <span>Baby Products</span>
            <span>Gaming</span>
            <span>Others catergories</span>
        </div>
        <div class="inbox">
            <div class="smallestbox">
                <span><i class="fa-solid fa-phone"></i>CALL TO ORDER</span>
                <span><i class="fa-solid fa-shop"></i>sell on jumia</span>
                <span><i class="fa-solid fa-truck-fast"></i>Send Your Package</span>
            </div>
            <div class="smallestbox tic"></div>
        </div>
    </div>
</body>

</html>
